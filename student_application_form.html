<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Admission Form</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f2f4f7;
            padding: 30px;
        }

        /* Main Container */

        .container {
            max-width: 1000px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        /* Heading */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #0d47a1;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        /* Form Grid */

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }

        /* Form Group */

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #0d47a1;
        }

        /* Full Width */

        .full-width {
            grid-column: 1 / -1;
        }

        /* Gender */

        .gender-options {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .gender-options label {
            font-weight: normal;
        }

        /* Buttons */

        .buttons {
            grid-column: 1 / -1;

            display: flex;
            justify-content: center;
            gap: 15px;

            margin-top: 10px;
        }

        .buttons input {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit {
            background-color: #0d47a1;
            color: white;
        }

        .reset {
            background-color: #777;
            color: white;
        }

        .submit:hover {
            background-color: #08306b;
        }

        .reset:hover {
            background-color: #555;
        }

        /* Tablet */

        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .buttons {
                grid-column: auto;
            }
        }

        /* Mobile */

        @media (max-width: 480px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .gender-options {
                flex-direction: column;
                gap: 8px;
            }

            .buttons {
                flex-direction: column;
            }

            .buttons input {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Student Admission Form</h1>

        <p>Please fill in the details below</p>

    </div>


    <form>

        <div class="form-grid">

            <!-- Student Name -->

            <div class="form-group">

                <label for="name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter student name"
                    required>

            </div>


            <!-- Roll Number -->

            <div class="form-group">

                <label for="rollno">
                    Roll Number
                </label>

                <input
                    type="text"
                    id="rollno"
                    name="rollno"
                    placeholder="Enter roll number"
                    required>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    required>

            </div>


            <!-- Mobile -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter mobile number"
                    required>

            </div>


            <!-- Date of Birth -->

            <div class="form-group">

                <label for="dob">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dob"
                    name="dob">

            </div>


            <!-- Course -->

            <div class="form-group">

                <label for="course">
                    Course
                </label>

                <select id="course" name="course">

                    <option value="">
                        Select Course
                    </option>

                    <option value="btech">
                        B.Tech
                    </option>

                    <option value="mtech">
                        M.Tech
                    </option>

                    <option value="bca">
                        BCA
                    </option>

                    <option value="mca">
                        MCA
                    </option>

                </select>

            </div>


            <!-- Gender -->

            <div class="form-group">

                <label>
                    Gender
                </label>

                <div class="gender-options">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="male">

                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="female">

                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="other">

                        Other
                    </label>

                </div>

            </div>


            <!-- Department -->

            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <select
                    id="department"
                    name="department">

                    <option value="">
                        Select Department
                    </option>

                    <option value="cse">
                        Computer Science and Engineering
                    </option>

                    <option value="ece">
                        Electronics and Communication Engineering
                    </option>

                    <option value="eee">
                        Electrical and Electronics Engineering
                    </option>

                    <option value="mech">
                        Mechanical Engineering
                    </option>

                    <option value="civil">
                        Civil Engineering
                    </option>

                </select>

            </div>


            <!-- Address -->

            <div class="form-group full-width">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter complete address"></textarea>

            </div>


            <!-- City -->

            <div class="form-group">

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter city">

            </div>


            <!-- State -->

            <div class="form-group">

                <label for="state">
                    State
                </label>

                <select
                    id="state"
                    name="state">

                    <option value="">
                        Select State
                    </option>

                    <option>
                        Andhra Pradesh
                    </option>

                    <option>
                        Telangana
                    </option>

                    <option>
                        Karnataka
                    </option>

                    <option>
                        Tamil Nadu
                    </option>

                    <option>
                        Kerala
                    </option>

                </select>

            </div>


            <!-- Buttons -->

            <div class="buttons">

                <input
                    type="submit"
                    value="Submit"
                    class="submit">

                <input
                    type="reset"
                    value="Reset"
                    class="reset">

            </div>

        </div>

    </form>

</div>

</body>
</html>
